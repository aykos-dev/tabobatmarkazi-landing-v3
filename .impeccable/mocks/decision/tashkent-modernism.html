<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Tashkent Modernism</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#ede6da;color:#1a1a1a;font-family:Futura,"Century Gothic",Arial,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;height:56px;padding:0 16px;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.relief{margin:4px 0 0;background:#1e3a8a;color:#ede6da;padding:26px 16px 22px;position:relative;overflow:hidden}
.relief:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(22,163,163,.55) 38px 44px),repeating-linear-gradient(0deg,transparent 0 38px,rgba(237,230,218,.12) 38px 40px)}
.relief *{position:relative}
.kick{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#7fd6d6}
h1{font-size:38px;line-height:1.02;font-weight:600;margin-top:10px}
.call{margin-top:18px;background:#ede6da;color:#1e3a8a;height:52px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;letter-spacing:.04em}
.panel{margin:18px 16px 0;height:240px;border:10px solid #c9b48f;background:#6d8a6a}
.cap{padding:8px 16px 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.list{margin:16px 16px 0;border-top:3px solid #1e3a8a}
.li{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #b8ad99;font-size:16px}
.li b{color:#16a3a3}
</style></head><body>
<div class="top"><span>Tabobat Markazi</span><span>Menyu</span></div>
<div class="relief"><div class="kick">Toshkent · Farobiy 2</div><h1>Sharq tabobati — zamonaviy klinikada</h1><a class="call">☎ +998 71 230 02 02</a></div>
<div class="panel"></div>
<div class="cap">Muolaja xonasi</div>
<div class="list"><div class="li"><span>Xizmatlar</span><b>150 000 so'mdan</b></div><div class="li"><span>Ta'lim</span><b>6 kurs</b></div><div class="li"><span>Fitobar</span><b>6 mahsulot</b></div></div>
</body></html>
