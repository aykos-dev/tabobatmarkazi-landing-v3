<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Category standard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;color:#0f172a;font-family:-apple-system,system-ui,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;height:60px;padding:0 16px;box-shadow:0 1px 0 #e2e8f0;font-weight:700}
.hero{padding:24px 16px 0}
.pill{display:inline-block;background:#ccfbf1;color:#0f766e;font-size:12px;padding:4px 10px;border-radius:99px}
h1{font-size:32px;line-height:1.1;margin-top:12px}
p{color:#475569;margin-top:10px;font-size:15px;line-height:1.5}
.btn{margin-top:16px;background:#0ea5a4;color:#fff;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700}
.img{margin:20px 16px 0;height:220px;border-radius:16px;background:#cbd5e1}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px 16px}
.card{height:110px;border-radius:14px;border:1px solid #e2e8f0;padding:12px;font-weight:600;font-size:14px}
</style></head><body>
<div class="top"><span>Tabobat Markazi</span><span>≡</span></div>
<div class="hero"><span class="pill">Sharq tabobati</span><h1>Sog'lig'ingiz tabiat bilan uyg'unlikda</h1><p>Hijoma, fitoterapiya, massaj va tabib konsultatsiyasi.</p><a class="btn">Qo'ng'iroq qilish</a></div>
<div class="img"></div>
<div class="cards"><div class="card">Hijoma</div><div class="card">Fitoterapiya</div><div class="card">Konsultatsiya</div><div class="card">Massaj</div></div>
</body></html>
