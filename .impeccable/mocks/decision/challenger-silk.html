<!doctype html>
<html><head><meta charset="utf-8"><title>Silk sketch</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:#FAF8F2;color:#1d1b2e;font-family:Helvetica,Arial,sans-serif;overflow:hidden;position:relative}
.top{display:flex;justify-content:space-between;padding:28px 56px;font-size:15px;letter-spacing:.12em;text-transform:uppercase}
.lane{position:absolute;left:-40px;right:-40px;height:150px;mix-blend-mode:multiply;opacity:.8}
.l1{top:170px;background:#2B3A8C;transform:rotate(-4deg)}
.l2{top:300px;background:#A8322D;transform:rotate(3deg)}
.l3{top:430px;background:#E9A92B;transform:rotate(-2deg)}
.l4{top:580px;background:#2B3A8C;opacity:.45;transform:rotate(5deg)}
.lab{position:absolute;left:56px;color:#fff;font-size:15px;letter-spacing:.18em;text-transform:uppercase}
h1{position:absolute;left:56px;top:110px;font-size:84px;line-height:.95;font-weight:300;width:820px;z-index:2}
.card{position:absolute;right:56px;top:300px;width:420px;background:#FAF8F2;padding:28px;z-index:3;border-top:6px solid #A8322D}
.card h3{font-size:26px;margin-bottom:16px}
.card span{display:block;border-bottom:1px solid #999;padding:12px 0;color:#888}
.card b{display:block;margin-top:18px;background:#A8322D;color:#fff;padding:14px;text-align:center}
</style></head><body>
<div class="top"><span>Tabobat Markazi</span><span>Ta'lim · Muolaja · Fitobar · Yangiliklar</span><span>UZ RU EN</span></div>
<div class="lane l1"></div><div class="lane l2"></div><div class="lane l3"></div><div class="lane l4"></div>
<span class="lab" style="top:330px">Ta'lim</span><span class="lab" style="top:460px">Muolaja</span><span class="lab" style="top:600px">Fitobar</span>
<h1>Tabobat ilmini o'rganing</h1>
<div class="card"><h3>Ariza</h3><span>Kurs</span><span>Ism</span><span>Telefon</span><b>Yuborish</b></div>
</body></html>
