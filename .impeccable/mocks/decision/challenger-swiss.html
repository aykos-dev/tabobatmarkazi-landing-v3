<!doctype html>
<html><head><meta charset="utf-8"><title>Swiss sketch</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:#fff;color:#111;font-family:Helvetica,Arial,sans-serif;overflow:hidden;padding:40px}
.top{display:flex;justify-content:space-between;font-size:15px;font-weight:700;margin-bottom:40px}
h1{font-size:96px;line-height:.92;letter-spacing:-.03em;font-weight:700;width:900px;margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;height:420px}
.p{border-top:6px solid #111;padding:16px 0;position:relative;overflow:hidden}
.p h3{font-size:24px;line-height:1.05}
.p .bar{position:absolute;left:0;bottom:60px;height:40px;background:#111}
.p .arc{position:absolute;right:-60px;bottom:-60px;width:180px;height:180px;border:24px solid #111;border-radius:50%}
.p.on{border-color:#E3000F}.p.on .bar,.p.on .arc{background:#E3000F;border-color:#E3000F}
.p.on .bar{background:#E3000F}
.btn{position:absolute;left:16px;bottom:16px;background:#E3000F;color:#fff;font-weight:700;padding:12px 18px}
</style></head><body>
<div class="top"><span>Tabobat Markazi</span><span>Ta'lim Muolaja Fitobar Tabiblar Yangiliklar</span><span>UZ RU EN</span></div>
<h1>Tabobat ilmini o'rganing. 6 kurs.</h1>
<div class="grid">
<div class="p on"><h3>Fitoterapiya asoslari</h3><p>8 hafta</p><div class="arc"></div><span class="btn">Ariza</span></div>
<div class="p"><h3>Hijoma amaliyoti</h3><p>6 hafta</p><div class="bar" style="width:70%"></div></div>
<div class="p"><h3>Aromaterapiya</h3><p>5 hafta</p><div class="arc"></div></div>
<div class="p"><h3>Islom tibbiyoti tarixi</h3><p>4 hafta</p><div class="bar" style="width:40%"></div></div>
<div class="p"><h3>Massaj terapiyasi</h3><p>7 hafta</p><div class="bar" style="width:85%;bottom:120px"></div></div>
<div class="p"><h3>Dorixona va retseptura</h3><p>10 hafta</p><div class="arc" style="right:auto;left:-60px"></div></div>
</div></body></html>
